# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/settings/webserver.pid;
error_log /var/log/sdkwork/settings/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name settings-test.sdkwork.com settings-test.birdcoder.com settings-test.dtupay.com settings-test.sdkwork.cn settings-test.birdcoder.cn settings-test.dtupay.cn settings-test.skubc.com settings-test.skubc.cn settings-test.zowalk.com settings-test.zowalk.cn settings-test.offer86.com settings-test.offer86.cn settings-test.86offer.com settings-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
