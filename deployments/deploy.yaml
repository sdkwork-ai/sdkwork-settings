version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: settings-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: settings-test.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
      - domain: settings-test.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
      - domain: settings-test.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.skubc.com
        tls: skubc.com
        mode: web+api
        web: adaptive
      - domain: settings-test.skubc.cn
        tls: skubc.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.zowalk.com
        tls: zowalk.com
        mode: web+api
        web: adaptive
      - domain: settings-test.zowalk.cn
        tls: zowalk.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.offer86.com
        tls: offer86.com
        mode: web+api
        web: adaptive
      - domain: settings-test.offer86.cn
        tls: offer86.cn
        mode: web+api
        web: adaptive
      - domain: settings-test.86offer.com
        tls: 86offer.com
        mode: web+api
        web: adaptive
      - domain: settings-test.86offer.cn
        tls: 86offer.cn
        mode: web+api
        web: adaptive
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
  cloud.staging:
