        mode: web
        web: adaptive
        domain: settings.skubc.com
      - tls: skubc.cn
        mode: web
        web: adaptive
        domain: settings.skubc.cn
      - tls: zowalk.com
        mode: web
        web: adaptive
        domain: settings.zowalk.com
      - tls: zowalk.cn
        mode: web
        web: adaptive
        domain: settings.zowalk.cn
      - tls: offer86.com
        mode: web
        web: adaptive
        domain: settings.offer86.com
      - tls: offer86.cn
        mode: web
        web: adaptive
        domain: settings.offer86.cn
      - tls: 86offer.com
        mode: web
        web: adaptive
        domain: settings.86offer.com
      - tls: 86offer.cn
        mode: web
        web: adaptive
        domain: settings.86offer.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:8080
          platform.api-gateway: http://127.0.0.1:3900
